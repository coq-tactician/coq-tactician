name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-12]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        with:
          output-dir: wheelhouse
        env:
          CIBW_BEFORE_ALL: >
            curl -O https://capnproto.org/capnproto-c++-0.10.4.tar.gz &&
            tar zxf capnproto-c++-0.10.4.tar.gz &&
            cd capnproto-c++-0.10.4 &&
            ./configure &&
            make -j6 check &&
            make install
          CIBW_TEST_COMMAND: pytact-check --help
          CIBW_SKIP: "*-musllinux* cp312-* pp*"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: install capnp
        run: sudo apt-get install capnproto libcapnp-dev

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pytactician-v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
